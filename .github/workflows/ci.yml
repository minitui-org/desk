name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MiniTui.Desk.sln

      - name: Build
        run: dotnet build src/MiniTui.Desk.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test src/MiniTui.Desk.sln --configuration Release --no-build

      - name: Native AOT
        run: |
          dotnet publish tests/MiniTui.Vt.AotHost/MiniTui.Vt.AotHost.csproj --configuration Release --output aot
          ./aot/MiniTui.Vt.AotHost
          dotnet publish tests/MiniTui.Desk.Protocol.AotHost/MiniTui.Desk.Protocol.AotHost.csproj --configuration Release --output aot-protocol
          ./aot-protocol/MiniTui.Desk.Protocol.AotHost

      # Every package, with the tools as Native AOT, and tuidesk installed from them as a user would (spec §16.3)
      - name: Pack
        run: |
          tools/pack.sh nupkg any -p:Version=$CI_VERSION
          tools/pack.sh nupkg linux-x64 -p:Version=$CI_VERSION
        env:
          CI_VERSION: 0.0.0-ci.${{ github.run_number }}

      - name: Install the tool
        run: |
          dotnet tool install MiniTui.Desk --tool-path tool --add-source nupkg --version 0.0.0-ci.${{ github.run_number }}
          test "$(./tool/tuidesk --version)" = 0.0.0-ci.${{ github.run_number }}

      # dotnet new tuidesk-app, from the packed template, outside the repo so none of its settings apply (spec §16.6):
      # it builds, tests, packs and installs, and tuidesk add reads its manifest
      - name: The template
        run: |
          hive="$RUNNER_TEMP/hive"
          dotnet new install nupkg/MiniTui.Desk.Templates.0.0.0-ci.${{ github.run_number }}.nupkg --debug:custom-hive "$hive"
          cd "$RUNNER_TEMP"
          dotnet new tuidesk-app -n Weather --debug:custom-hive "$hive"
          cd Weather
          feed="-p:RestoreAdditionalProjectSources=$GITHUB_WORKSPACE/nupkg"
          dotnet build -warnaserror "$feed"
          dotnet test --no-build
          dotnet pack Weather -o nupkg "$feed"
          dotnet pack Weather -r linux-x64 -o nupkg "$feed"
          dotnet tool install Weather --tool-path tool --add-source nupkg --version 0.1.0
          XDG_DATA_HOME="$RUNNER_TEMP/data" "$GITHUB_WORKSPACE/tool/tuidesk" add "$PWD/tool/weather" | tee added
          grep -q "Added weather: Weather" added

  # The arm64 tools are built on arm64, as Native AOT needs
  arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          tools/pack.sh nupkg any -p:Version=$CI_VERSION
          tools/pack.sh nupkg linux-arm64 -p:Version=$CI_VERSION
        env:
          CI_VERSION: 0.0.0-ci.${{ github.run_number }}

      - name: Install the tool
        run: |
          dotnet tool install MiniTui.Desk --tool-path tool --add-source nupkg --version 0.0.0-ci.${{ github.run_number }}
          test "$(./tool/tuidesk --version)" = 0.0.0-ci.${{ github.run_number }}
          file -L tool/tuidesk | grep -q aarch64
